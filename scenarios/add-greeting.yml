id: add-greeting
name: Add greeting helper

source:
  repository: Muriel-Salvan/cline-rb
  commit: v1.1.1

sandbox:
  owner_env: GITHUB_OWNER
  name_prefix: agentic-dev-bench

issue:
  title: Add a greeting helper
  body: |
    Add a small reusable greeting helper to the cline-rb config.

    Requirements:
    - Add a method named `greeting` in Cline::Config.
    - It must return exactly `Hello, world!`.
    - Add automated tests covering the new behavior.
    - Keep the implementation small and idiomatic for the repository.

agent:
  # Harbor agent identifier (from Harbor's agent catalog)
  name: cline-cli
  # Model identifier (Harbor agent registry)
  model: cline:cline-free/muse-spark-1.3-contributor

evaluation:
  command: "bundle exec rspec"
  metrics:
    - exit_code
    - success
    - elapsed_seconds
    - git_diff_stat
